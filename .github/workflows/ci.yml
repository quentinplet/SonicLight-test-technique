name: CI

on:
  push:
  pull_request:

jobs:
  server:
    runs-on: ubuntu-latest
    # Integration tests run against a real Postgres, on the same host port as docker compose,
    # so the test database URL is identical locally and in CI.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: soniclight
          POSTGRES_PASSWORD: soniclight
          POSTGRES_DB: soniclight_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U soniclight"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      # ci, never install: the lockfile is honoured exactly.
      - run: npm ci
      # Before the typecheck, or tsc fails on missing types without naming the cause.
      # Needs no database: prisma.config.ts tolerates an absent DATABASE_URL.
      - run: npx prisma generate
      - run: npx tsc --noEmit
      - run: npm run test:db
      - run: npm test
      - run: npm run build

  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # vue-tsc --build: a bare `vue-tsc --noEmit` on the solution tsconfig checks no file.
      - run: npm run type-check
      - run: npm run build-only
        env:
          VITE_API_URL: http://localhost:3000
